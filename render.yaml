services:
  - type: web
    name: agriwatch-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: https://agriwatch.vercel.app,http://localhost:5173
    healthCheckPath: /
